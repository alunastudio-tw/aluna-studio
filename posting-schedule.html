<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>艾妮莎招租文案排程</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7;--wood:#D4B090;--gold:#C9A84C;
  --dark:#2C2418;--mid:#9E896A;--light:#F0E8D8;
  --white:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:var(--bg);color:var(--dark);-webkit-tap-highlight-color:transparent;}

.hd{background:var(--dark);padding:1.2rem 1.2rem 1rem;text-align:center;}
.hd-sub{font-size:0.6rem;letter-spacing:0.3em;color:var(--gold);margin-bottom:0.4rem;text-transform:uppercase;}
.hd h1{font-family:'Noto Serif TC',serif;font-size:1.5rem;font-weight:900;color:var(--bg);letter-spacing:0.15em;}
.hd-note{font-size:0.65rem;color:rgba(255,255,255,0.4);margin-top:0.4rem;letter-spacing:0.05em;}

/* Day 選單 */
.day-tabs-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--dark);padding:0 0.8rem 0.8rem;border-bottom:2px solid var(--wood);}
.day-tabs{display:flex;gap:0.4rem;min-width:max-content;}
.day-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;
          color:rgba(255,255,255,0.55);font-size:0.65rem;font-weight:500;padding:0.4rem 0.65rem;cursor:pointer;
          white-space:nowrap;transition:all 0.2s;letter-spacing:0.04em;}
.day-btn.active{background:var(--gold);border-color:var(--gold);color:var(--dark);font-weight:700;}
.day-btn.done{opacity:0.5;}

/* 內容區 */
.content{padding:1rem 1rem 3rem;}
.day-info{background:var(--light);border-radius:10px;padding:0.8rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:1rem;}
.day-num{font-family:'Noto Serif TC',serif;font-size:2rem;font-weight:900;color:var(--gold);line-height:1;}
.day-meta{flex:1;}
.day-date{font-size:0.68rem;color:var(--mid);letter-spacing:0.06em;}
.day-theme{font-size:1rem;font-weight:700;color:var(--dark);margin-top:0.2rem;letter-spacing:0.04em;}

/* 平台切換 */
.platform-tabs{display:flex;gap:0.5rem;margin-bottom:0.8rem;}
.plt-btn{flex:1;background:var(--light);border:1px solid var(--wood);border-radius:8px;
          padding:0.5rem;font-size:0.72rem;font-weight:700;color:var(--mid);cursor:pointer;
          text-align:center;transition:all 0.15s;}
.plt-btn.active{background:var(--gold);border-color:var(--gold);color:var(--dark);}

/* 文案卡 */
.copy-card{background:var(--white);border-radius:12px;padding:1rem;box-shadow:0 1px 6px rgba(44,36,24,0.08);margin-bottom:0.8rem;}
.copy-card-label{font-size:0.6rem;font-weight:700;letter-spacing:0.2em;color:var(--mid);text-transform:uppercase;margin-bottom:0.6rem;}
.copy-text{font-size:0.82rem;line-height:1.9;color:var(--dark);white-space:pre-wrap;min-height:60px;}
.copy-btn{display:flex;align-items:center;justify-content:center;gap:0.35rem;width:100%;
           background:var(--dark);border:none;border-radius:8px;color:var(--bg);
           font-size:0.75rem;font-weight:700;padding:0.65rem;margin-top:0.8rem;cursor:pointer;letter-spacing:0.06em;
           transition:background 0.15s;}
.copy-btn:active{background:var(--gold);color:var(--dark);}
.copy-btn.copied{background:var(--gold);color:var(--dark);}

/* 導航 */
.nav-row{display:flex;gap:0.5rem;margin-top:1rem;}
.nav-btn{flex:1;background:var(--light);border:1px solid var(--wood);border-radius:8px;
          padding:0.65rem;font-size:0.8rem;font-weight:700;color:var(--dark);cursor:pointer;text-align:center;}
.nav-btn:active{background:var(--wood);color:var(--white);}
.nav-btn:disabled{opacity:0.3;cursor:default;}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-sub">AlunaStudio · 艾妮莎綜合療癒工作室</div>
  <h1>招租文案排程</h1>
  <div class="hd-note">5/17（六）—— 5/31（六）· 共 15 天</div>
</div>

<div class="day-tabs-wrap">
  <div class="day-tabs" id="dayTabs"></div>
</div>

<div class="content">
  <div class="day-info">
    <div class="day-num" id="dayNum">01</div>
    <div class="day-meta">
      <div class="day-date" id="dayDate"></div>
      <div class="day-theme" id="dayTheme"></div>
    </div>
  </div>

  <div class="platform-tabs">
    <button class="plt-btn active" onclick="switchPlatform('threads',this)">Threads</button>
    <button class="plt-btn" onclick="switchPlatform('fb',this)">FB 社團</button>
  </div>

  <div class="copy-card" id="copyCard">
    <div class="copy-card-label" id="cardLabel">Threads 文案</div>
    <div class="copy-text" id="copyText"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyText()">📋 一鍵複製</button>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" onclick="changeDay(-1)">← 前一天</button>
    <button class="nav-btn" id="nextBtn" onclick="changeDay(1)">後一天 →</button>
  </div>
</div>

var currentDay = 0;
var currentPlatform = 'threads';

function init() {
  var tabs = document.getElementById('dayTabs');
  DAYS.forEach(function(d, i) {
    var btn = document.createElement('button');
    btn.className = 'day-btn' + (i === 0 ? ' active' : '');
    btn.textContent = 'Day ' + (i+1).toString().padStart(2,'0');
    btn.onclick = (function(idx){return function(){selectDay(idx);};})(i);
    tabs.appendChild(btn);
  });
  renderDay(0);
}

function selectDay(idx) {
  currentDay = idx;
  document.querySelectorAll('.day-btn').forEach(function(b,i){
    b.classList.toggle('active', i === idx);
  });
  renderDay(idx);
}

function renderDay(idx) {
  var d = DAYS[idx];
  document.getElementById('dayNum').textContent = (idx+1).toString().padStart(2,'0');
  document.getElementById('dayDate').textContent = d.date;
  document.getElementById('dayTheme').textContent = d.theme;
  renderContent();
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === DAYS.length - 1;
  document.getElementById('copyBtn').textContent = '📋 一鍵複製';
  document.getElementById('copyBtn').classList.remove('copied');
}

function renderContent() {
  var d = DAYS[currentDay];
  var text = currentPlatform === 'threads' ? d.threads : d.fb;
  var label = currentPlatform === 'threads' ? 'Threads 文案' : 'FB 社團文案';
  document.getElementById('cardLabel').textContent = label;
  document.getElementById('copyText').textContent = text;
}

function switchPlatform(platform, btn) {
  currentPlatform = platform;
  document.querySelectorAll('.plt-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderContent();
  document.getElementById('copyBtn').textContent = '📋 一鍵複製';
  document.getElementById('copyBtn').classList.remove('copied');
}

function copyText() {
  var text = document.getElementById('copyText').textContent;
  var btn = document.getElementById('copyBtn');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){
      btn.textContent = '✅ 已複製！';
      btn.classList.add('copied');
      setTimeout(function(){btn.textContent='📋 一鍵複製';btn.classList.remove('copied');}, 2000);
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ 已複製！';
    btn.classList.add('copied');
    setTimeout(function(){btn.textContent='📋 一鍵複製';btn.classList.remove('copied');}, 2000);
  }
}

function changeDay(delta) {
  var next = currentDay + delta;
  if (next >= 0 && next < DAYS.length) selectDay(next);
}

init();
</script>
</body>
</html>
